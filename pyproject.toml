[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openforge-network"
version = "0.1.0"
description = "Open connection and activity layer for creative production."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OpenForge Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
openforge = "openforge.cli:main"

[tool.setuptools]
package-dir = { "" = "sdk/python" }

[tool.setuptools.packages.find]
where = ["sdk/python"]

[tool.setuptools.package-data]
openforge = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["sdk/python"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openforge"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["sdk/python/openforge"]
